---
- name: Deploy and configure keytabs for 1C servers
  hosts: all  # Указываем, что плейбук будет выполняться на всех хостах из инвентаря
  become: true  # Выполнять задачи с повышенными привилегиями (sudo)
  vars_prompt:
    - name: ansible_password
      prompt: "Введите пароль для подключения к хостам"
      private: yes

  vars:
    keytabs:
      # пример хостов и имен кейтабов
      # - { host: "some_host_ip", keytab: "svc_1c.keytab" }


  tasks:
    - name: Ensure /opt/1cv8/conf directory exists
      file:
        path: /opt/1cv8/conf
        state: directory
        owner: usr1cv8
        group: grp1cv8
        mode: '0755'
      tags: setup

    - name: Copy keytab file to remote servers
      copy:
        src: "/ansible/keytabs/{{ keytabs | selectattr('host', 'equalto', inventory_hostname) | map(attribute='keytab') | first }}"
        dest: "/opt/1cv8/conf/usr1cv8.keytab"
        owner: usr1cv8
        group: grp1cv8
        mode: '0644'
        force: yes
      tags: copy
      when: inventory_hostname in keytabs | map(attribute='host') | list

    - name: Check if principal exists in keytab
      command: klist -k -t /opt/1cv8/conf/usr1cv8.keytab
      register: keytab_principals
      changed_when: false
      tags: kerberos
      when: inventory_hostname in keytabs | map(attribute='host') | list

    - name: Initialize Kerberos ticket using keytab
      command: kinit -k -t /opt/1cv8/conf/usr1cv8.keytab usr1cv8/{{ inventory_hostname }}.domen.ru
      tags: kerberos
      when:
        - inventory_hostname in keytabs | map(attribute='host') | list
        - keytab_principals is defined
        - "'usr1cv8/' + inventory_hostname + '.domen.ru' in keytab_principals.stdout"
      ignore_errors: yes  # Продолжать выполнение, даже если kinit завершился с ошибкой

    - name: Log kinit result
      debug:
        msg: |
          {% if keytab_principals is defined and 'usr1cv8/' + inventory_hostname + '.domen.ru' in keytab_principals.stdout %}
            Kerberos ticket initialized for {{ inventory_hostname }}
          {% else %}
            Principal 'usr1cv8/{{ inventory_hostname }}.domen.ru' not found in keytab
          {% endif %}
      tags: kerberos
      when: inventory_hostname in keytabs | map(attribute='host') | list
