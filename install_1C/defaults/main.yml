# defaults file for install_1C

# Директория, куда будет загружен файл установки
ins_dir_dest: /home/ivanov_ii/distr/platform

# URL файла установки 1С 22 платформа
platform_installer_url: some_host_url

# Имя файла установки (генерируется динамически)
inst_file_name: "setup-full-{{ onec_version_name }}-x86_64.run"

# Устанавливаемые компоненты платформы
enable_components: server,server_admin,additional_admin_functions

# Флаг, указывающий, нужно ли удалять старые службы 1С
flag_Remove_old_1C_service: true

# Список старых служб 1С для остановки и удаления
old_services:
  - "srv1cv8-{{ SRV1CV8_PORT }}"
  - "ras-{{ RAS_PORT }}"
